<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAPE 2기 면접 시간 확인</title>
<meta name="description" content="SHAPE 2기 부원 선발 면접 대상자가 이름과 학번으로 본인의 면접 시작 시간을 확인하는 페이지입니다.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="SHAPE 2기 면접 시간 확인">
<meta property="og:description" content="이름과 학번을 입력하시면 본인의 면접 시작 시간을 알려 드립니다.">
<link rel="icon" href="assets/shape-symbol.png">
<link rel="apple-touch-icon" href="assets/shape-symbol.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/shape-kit.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="page">

  <header class="page-header">
    <img class="page-logo" src="assets/shape-symbol.png" alt="SHAPE" width="28" height="28">
    <span class="page-wordmark">SHAPE</span>
    <span class="page-header-sub">2기 부원 선발 면접</span>
  </header>

  <main class="stage">
    <div class="stage-in">

      <div id="intro" class="intro">
        <p class="sh-eyebrow">INTERVIEW</p>
        <h1 class="stage-title">면접 시간 확인</h1>
      </div>

      <form id="lookup" class="lookup-card" novalidate>
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" enterkeyhint="next" placeholder="홍길동" maxlength="40" required>
        </div>
        <div class="field">
          <label for="sid">학번</label>
          <input id="sid" name="sid" type="text" inputmode="numeric" autocomplete="off"
                 autocapitalize="off" spellcheck="false" enterkeyhint="go"
                 placeholder="2025-12345" maxlength="20" required>
        </div>
        <p class="form-note error" id="formError" role="alert" hidden></p>
        <button class="button block" id="submitBtn" type="submit">면접 시간 보기</button>
      </form>

      <div id="result" class="result" hidden></div>

    </div>
  </main>

  <dialog id="contactDialog" class="dialog contact-dialog">
    <h2>문의하기</h2>
    <p class="contact-body">면접 일정에 관해 궁금한 점이 있거나 시간을 조정하셔야 하면
      아래 주소로 연락해 주세요.</p>
    <a class="contact-mail" href="mailto:snu.shape@gmail.com">snu.shape@gmail.com</a>
    <div class="contact-actions">
      <button type="button" class="button secondary" id="copyMailBtn">주소 복사</button>
      <button type="button" class="button" id="closeDialogBtn" autofocus>닫기</button>
    </div>
  </dialog>

  <footer class="page-footer">
    <span class="footer-text">SHAPE — 서울대학교 휴머노이드 · Physical AI 동아리</span>
    <nav class="footer-links" aria-label="바로가기">
      <a class="icon-link" href="https://www.snu-shape.com" target="_blank" rel="noopener"
         title="SHAPE 웹사이트" aria-label="SHAPE 웹사이트 (새 탭에서 열림)">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25"/>
          <path d="M2.75 12h18.5"/>
          <path d="M12 2.75a14.5 14.5 0 0 1 3.6 9.25 14.5 14.5 0 0 1-3.6 9.25 14.5 14.5 0 0 1-3.6-9.25A14.5 14.5 0 0 1 12 2.75z"/>
        </svg>
      </a>
      <a class="icon-link" href="https://www.instagram.com/snu_shape" target="_blank" rel="noopener"
         title="SHAPE 인스타그램" aria-label="SHAPE 인스타그램 (새 탭에서 열림)">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M17.4 6.6h.01"/>
        </svg>
      </a>
    </nav>
  </footer>

</div>

<script src="assets/schedule.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
