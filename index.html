<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHAPE 2기 면접 시간 확인</title>
<meta name="description" content="SHAPE 2기 부원 선발 면접 대상자가 이름과 학번으로 본인의 면접 시작 시간을 확인하는 페이지입니다.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="SHAPE 2기 면접 시간 확인">
<meta property="og:description" content="이름과 학번을 입력하시면 본인의 면접 시작 시간을 알려 드립니다.">
<link rel="icon" href="assets/shape-symbol.png">
<link rel="apple-touch-icon" href="assets/shape-symbol.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/shape-kit.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="page">

  <header class="page-header">
    <img class="page-logo" src="assets/shape-symbol.png" alt="SHAPE" width="28" height="28">
    <span class="page-wordmark">SHAPE</span>
    <span class="page-header-sub">2기 부원 선발 면접</span>
  </header>

  <main class="stage">
    <div class="stage-in">

      <div id="intro" class="intro">
        <p class="sh-eyebrow">INTERVIEW</p>
        <h1 class="stage-title">면접 시간 확인</h1>
        <p class="stage-lead">이름과 학번을 넣으시면 본인의 면접 시작 시간을 알려 드립니다.</p>
      </div>

      <form id="lookup" class="lookup-card" novalidate>
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" enterkeyhint="next" placeholder="홍길동" maxlength="40" required>
        </div>
        <div class="field">
          <label for="sid">학번</label>
          <input id="sid" name="sid" type="text" inputmode="numeric" autocomplete="off"
                 autocapitalize="off" spellcheck="false" enterkeyhint="go"
                 placeholder="2025-12345" maxlength="20" required>
        </div>
        <p class="form-note error" id="formError" role="alert" hidden></p>
        <button class="button block" id="submitBtn" type="submit">면접 시간 보기</button>
        <p class="form-note lookup-foot">지원서에 적으신 이름·학번 그대로. 입력값은 이 브라우저 안에서만 대조합니다.</p>
      </form>

      <div id="result" class="result" hidden></div>

    </div>
  </main>

  <footer class="page-footer">
    <span>SHAPE — 서울대학교 휴머노이드 · Physical AI 동아리</span>
    <a href="https://www.snu-shape.com" rel="noopener">www.snu-shape.com</a>
  </footer>

</div>

<script src="assets/schedule.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
